name: Windows 发布包

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装与测试
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller==6.16.0
          python -m unittest discover -s backend/tests -p "test*.py"
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: 构建并验证 Windows 安装包
        shell: pwsh
        run: ./windows/build-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FirmMatterCodeManagement-win-x64
          path: build/windows-release/FirmMatterCodeManagement-win-x64.zip
          if-no-files-found: error
      - name: 附加到 GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:GITHUB_REF_NAME build/windows-release/FirmMatterCodeManagement-win-x64.zip --clobber
